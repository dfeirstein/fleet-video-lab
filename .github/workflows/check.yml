name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: make lint

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/scan_private.sh

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # report mode on a keyless runner: must exit 0 and print the full table
      - run: python3 tools/doctor.py --offline
      - name: every tool answers --help without keys
        run: |
          for f in tools/*.py; do python3 "$f" --help > /dev/null || { echo "--help failed: $f"; exit 1; }; done
          node tools/capture.mjs --help
      - name: a missing key fails with one 'set NAME' line
        run: |
          out=$(python3 tools/eleven.py sfx x 1 a.mp3 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^set ELEVENLABS_API_KEY'

  demo-dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: ffmpeg -version | head -1
      # exactly what a new user does: a fresh venv, the pip step from the README, then the demo
      - name: fresh venv, pip install, make demo-dry
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          make demo-dry
      - name: done-check unit test on the demo output
        run: |
          . .venv/bin/activate
          make test
      - name: proof files exist
        run: ls -la examples/hello-table/out/final.mp4 examples/hello-table/frames/contact-sheet.png examples/hello-table/SPEND.md examples/hello-table/index.html
      - name: the run leaves the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: hello-table-dry
          path: |
            examples/hello-table/out/final.mp4
            examples/hello-table/frames/
            examples/hello-table/SPEND.md
            examples/hello-table/index.html

  # a new user who skipped the pip step: make demo-dry must stop first with one line, no traceback, nothing built
  demo-dry-no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: make demo-dry without numpy exits non-zero with the one-line pip message
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          ! python3 -c "import numpy" 2>/dev/null || { echo "numpy is present; this job needs it absent"; exit 1; }
          set +e
          out=$(make demo-dry 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "exit $code"
          test "$code" -ne 0
          echo "$out" | grep -qx 'run: pip install -r requirements.txt'
          if echo "$out" | grep -q Traceback; then echo "a traceback leaked"; exit 1; fi
          test ! -e examples/hello-table/out
